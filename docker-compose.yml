version: '3.8'

services:
  mysql-users:
    image: mysql:8.0
    container_name: mysql-users-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: users_db
      MYSQL_USER: dmh_user
      MYSQL_PASSWORD: dmh_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-users-volume:/var/lib/mysql
    networks:
      - dmh-network

  mysql-accounts:
    image: mysql:8.0
    container_name: mysql-accounts-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: accounts_db
      MYSQL_USER: dmh_user
      MYSQL_PASSWORD: dmh_password
    ports:
      - "3308:3306"
    volumes:
      - mysql-accounts-volume:/var/lib/mysql
    networks:
      - dmh-network

  eureka-server:
    image: openjdk:11-jre-slim
    container_name: eureka-server
    working_dir: /app
    volumes:
      - ./eureka-server:/app
    ports:
      - "8761:8761"
    command: java -jar app.jar
    depends_on:
      - mysql-users
      - mysql-accounts
    networks:
      - dmh-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  api-gateway:
    image: openjdk:11-jre-slim
    container_name: api-gateway
    working_dir: /app
    volumes:
      - ./api-gateway:/app
    ports:
      - "8080:8080"
    command: java -jar app.jar
    depends_on:
      - eureka-server
    networks:
      - dmh-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

  auth-service:
    image: openjdk:11-jre-slim
    container_name: auth-service
    working_dir: /app
    volumes:
      - ./auth-service:/app
    ports:
      - "8088:8088"
    command: java -jar app.jar
    depends_on:
      - eureka-server
    networks:
      - dmh-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/

  users-service:
    image: openjdk:11-jre-slim
    container_name: users-service
    working_dir: /app
    volumes:
      - ./users-service:/app
    ports:
      - "8081:8081"
    command: java -jar app.jar
    depends_on:
      - eureka-server
      - mysql-users
    networks:
      - dmh-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-users:3306/users_db
      - SPRING_DATASOURCE_USERNAME=dmh_user
      - SPRING_DATASOURCE_PASSWORD=dmh_password

  accounts-service:
    image: openjdk:11-jre-slim
    container_name: accounts-service
    working_dir: /app
    volumes:
      - ./accounts-service:/app
    ports:
      - "8082:8082"
    command: java -jar app.jar
    depends_on:
      - eureka-server
      - mysql-accounts
    networks:
      - dmh-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-accounts:3306/accounts_db
      - SPRING_DATASOURCE_USERNAME=dmh_user
      - SPRING_DATASOURCE_PASSWORD=dmh_password

volumes:
  mysql-users-volume:
  mysql-accounts-volume:

networks:
  dmh-network:
    driver: bridge

