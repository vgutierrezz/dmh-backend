spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Configuración Global de CORS para integración con Frontend
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: users-service
          uri: lb://USERS-SERVICE
          predicates:
            - Path=/api/users/**
          # filters:
          #   - AuthenticationFilter # Descomentar cuando la clase Java esté creada en el Sprint 2

        - id: accounts-service
          uri: lb://ACCOUNTS-SERVICE
          predicates:
            - Path=/api/accounts/**
          # filters:
          #   - AuthenticationFilter

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true
    instanceId: ${spring.cloud.client.hostname}:${spring.application.name}:${server.port}

# Swagger/OpenAPI configuration (Unificada sin claves duplicadas)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    urls:
      - name: Auth Service
        url: /v3/api-docs/auth-service
      - name: Users Service
        url: /v3/api-docs/users-service
      - name: Accounts Service
        url: /v3/api-docs/accounts-service
  show-actuator: false

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Logging
logging:
  level:
    root: INFO
    com.dmh: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG